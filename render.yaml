services:
  # PostgreSQL Database
  - type: pserv
    name: learnwise-postgres
    env: docker
    plan: free
    region: oregon
    
  # Backend API
  - type: web
    name: learnwise-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnwise-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_MODE
        value: true
      - key: CLIENT_URL
        sync: false
    
  # Frontend
  - type: web
    name: learnwise-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: learnwise-postgres
    databaseName: learnwise_ai
    user: learnwise_user
    plan: free
    region: oregon
